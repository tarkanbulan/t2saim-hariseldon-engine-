# T2SAIM TÜRKİYE KRİZ ERKEN UYARI MOTORU EŞİK VE SABİTLERİ (v5.0)

thresholds:
  macro:
    m2_nir_critical: 15.0         # M2 Para Arzı / Net Rezerv kritik patlama eşiği
    net_nir_danger_usd: -40.0     # Swap hariç net rezerv tehlike bölgesi (-40 Mr $)
    reer_pendulum_peak: 68.0      # TÜFE Bazlı REER sarkaç aşırı değerlenme tepesi
    ext_debt_service_1y: 191.0    # 12 ay içinde vadesi gelen dış borç (Mr $)
  
  banking:
    ldr_critical: 1.15            # Kredi / Mevduat Oranı kritik likidite sıkışması
    npl_spread_multiplier: 2.0    # Gerçek NPL / Resmi NPL çarpanı
    ted_spread_danger: 5.0        # Gösterge tahvil - mevduat faiz makası (%)
  
  neuro:
    chi_sigma: 0.25               # Amigdala oynaklık duyarlılığı
    kappa_p: 5.0464               # Prefrontal korteks sönümleme eğimi
    theta_panic: 0.70             # Panik eşiği
    herd_threshold: 0.50          # Kuramoto sürü kilitlenme eşiği
  
  gullini:
    minsky_singularity_date: "2026-11-18" # t* Tekillik günü
    singularity_horizon_days: 90          # Üstel yaklaşım penceresi
  
  acemoglu:
    procurement_hhi_oligopoly: 2500       # İhale oligopol eşiği
    procurement_hhi_lockdown: 4000        # İhale tam kilitlenme eşiği
    kik_21b_danger_ratio: 0.35            # Pazarlık usulü dağıtım oranı (%)
    rent_to_mfg_credit_max: 2.5           # Rant / İmalat kredi oranı
    caliper_cv_max: 0.15                  # Gece yarısı kararnameleri CV eşiği

calibration:
  amnesia_lambda_nominal: 0.15   # Nominal travma sönümleme katsayısı (3 ay)
  amnesia_lambda_drift: 0.25     # Rejim kayması anında sönümleme katsayısı
  ece_target: 0.0124             # Beklenen kalibrasyon hatası hedefi
  dempster_shafer_conflict_k: 0.85 # Çelişki durumunda çekimser kalma (Abstention)
  uci_cash_gate_threshold: 0.65  # Tam nakde ve VIOP hedge'e geçiş eşiği
